# ===================================================================
# DATABASE (PostgreSQL)
# ===================================================================
# Database connection URL. We use environment variables to avoid hardcoding credentials.
# Example: jdbc:postgresql://localhost:5432/scrumpoker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}

# Database username and password
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
# Dialect for PostgreSQL. Helps Hibernate generate correct SQL.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# hibernate.ddl-auto:
#   validate: (recommended for production) validates the schema, makes sure it matches the entities.
#   update:   (convenient for development) automatically adds/alters columns and tables.
#   create-drop: (used for tests) creates the schema at startup and drops it at shutdown.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console. Useful for debugging.
spring.jpa.show-sql=true

# Format SQL queries for better readability.
spring.jpa.properties.hibernate.format_sql=true
