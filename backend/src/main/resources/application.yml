server:
  port: 8080

spring:
  application:
    name: scrum-poker-backend

  datasource:
    url: jdbc:h2:mem:scrumpoker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - https://scrum-poker-publisher.vercel.app
    - https://scrum-poker-backend-l2wo.onrender.com
  room:
    max-voters: 100
